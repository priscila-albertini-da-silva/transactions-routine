name: CI Pipeline to Transactions Routine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.22

      - name: Check Go version
        run: go version

      - name: Install dependencies
        run: go mod tidy

      - name: Build Go project
        run: go build -v ./...

      - name: Install SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner-cli.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner-cli.zip
          export PATH="$PATH:$(pwd)/sonar-scanner-4.8.0.2856-linux/bin"

      - name: Run Go tests with coverage
        run: |
          go test -coverprofile=coverage.out ./...

      - name: Run integration tests
        # add database later
        run: go test -tags=integration -v ./...

      - name: Run Go Linter
        run: golangci-lint run

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=priscila-albertini-silva_transactions-routine \
            -Dsonar.organization=priscila-albertini-silva \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}


            name: SonarQube Analysis
